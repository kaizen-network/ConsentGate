config-version: 1
enabled: false
scope: main
gate:
  timeout-seconds: 300
  max-pending: 128
language:
  default: en-US
  use-client-locale: true
  selector:
    enabled: false
    title: "<gold><bold>Language / Bahasa</bold></gold>"
    prompt: "<gray>Choose the language used for these documents.</gray>"
    columns: 2
    options:
      en-US: "English"
      id-ID: "Bahasa Indonesia"
appearance:
  title-color: gold
  accent-color: gold
  text-color: white
  muted-color: gray
  error-color: red
  button-color: white
bedrock:
  native-forms: false
  button-color: dark_gray
documents:
  directory: documents
storage:
  type: sqlite
  sqlite:
    file: data/consent.db
  # Remote storage is opt-in. Install db/mysql-v1.sql before selecting mysql or mariadb.
  # See docs/15-remote-storage.md for credentials, TLS, and the cache freshness limit.
