name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle.kts
            **/gradle.lockfile
            gradle/verification-metadata.xml
            gradle/wrapper/gradle-wrapper.properties

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Test Python tools
        run: python -m unittest discover -s tools -p 'test_*.py'

      - name: Test Node tools
        run: node --test tools/test_paper_probe.cjs

      - name: Build, test, and package both platforms
        run: python tools/prepare_local_release.py --sources .run/release-sources --fetch-sources

      - name: Save distribution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ConsentGate-${{ github.sha }}
          path: |
            build/distributions/*.zip
            build/distributions/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Save test and build reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-reports-${{ github.sha }}
          path: |
            */build/test-results/*/TEST-*.xml
            */build/reports/tests/
            build/reports/dependency-verification/
          if-no-files-found: ignore
          retention-days: 7
