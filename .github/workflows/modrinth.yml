name: Publish to Modrinth

# Uploads a published GitHub release's JARs to Modrinth and syncs MODRINTH.md
# as the project description. Run it by hand with a tag to publish an existing
# release. Versions already on Modrinth are skipped, so re-running is safe.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: modrinth-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Modrinth
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Checks out the ref that started the run: the release tag on a release event, or the branch chosen for a manual run. The publisher, MODRINTH.md, and the changelog come from that checkout. To publish an older tag that lacks them, start a manual run from the default branch.
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release JARs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir dist

      - name: Upload to Modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/publish_modrinth.py --tag "$TAG" --dist dist
