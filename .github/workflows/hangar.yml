name: Publish to Hangar

# Uploads a published GitHub release's JARs to Hangar and syncs MODRINTH.md
# as the main page. Run it by hand with a tag to publish an existing
# release. Versions already on Hangar are skipped, so re-running is safe.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, for example v0.2.0
        required: true

permissions:
  contents: read

concurrency:
  group: hangar-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to Hangar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # The default branch, not the tag: it has the publisher, MODRINTH.md, and
      # the changelog, which older tags may lack.
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download release JARs
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.jar' --dir dist

      - name: Upload to Hangar
        env:
          HANGAR_TOKEN: ${{ secrets.HANGAR_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/publish_hangar.py --tag "$TAG" --dist dist
