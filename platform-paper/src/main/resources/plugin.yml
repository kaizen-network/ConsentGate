name: ConsentGate
version: '${version}'
main: io.github.consentgate.paper.ConsentGatePaper
api-version: '1.21.7'
description: Configurable pre-admission agreements
softdepend: [Geyser-Spigot]
commands:
  consentgate:
    description: Inspect consent records and manage ConsentGate
    usage: /consentgate <status|reset|validate|reload>
permissions:
  consentgate.admin.status:
    description: Inspect current consent acceptance
    default: op
  consentgate.admin.reset:
    description: Require consent again while preserving history
    default: op
  consentgate.admin.validate:
    description: Validate edited ConsentGate files without applying them
    default: op
  consentgate.admin.reload:
    description: Validate and reload supported ConsentGate settings
    default: op
