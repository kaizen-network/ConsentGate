config-version: 1
enabled: false
scope: main
gate:
  timeout-seconds: 300
  max-pending: 128
language:
  default: en-US
  use-client-locale: true
appearance:
  title-color: gold
  accent-color: gold
  text-color: white
  muted-color: gray
  error-color: red
  button-color: white
documents:
  directory: documents
storage:
  type: sqlite
  sqlite:
    file: data/consent.db
